<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>directeurAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
      .modal { background-color: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 350px; text-align: center; }
      h1 { font-size: 1.5rem; margin-top: 0; margin-bottom: 1.5rem; color: #e2e8f0; }
      .btn { display: block; width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; box-sizing: border-box; }
      .btn-primary { background-color: #3b82f6; color: white; }
      .btn-primary:hover { background-color: #2563eb; }
      .btn-secondary { background-color: transparent; color: #94a3b8; border: 1px solid #475569; }
      .btn-secondary:hover { background-color: #334155; color: #e2e8f0; }
      #remote-form { display: none; margin-top: 1rem; text-align: left; }
      input { width: 100%; padding: 0.75rem; border: 1px solid #475569; background-color: #0f172a; color: white; border-radius: 6px; box-sizing: border-box; margin-bottom: 1rem; }
      .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; display: none; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      #status-text { margin-top: 1rem; color: #94a3b8; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div class="modal">
      <h1>directeur<span style="color:#3b82f6">AI</span> Engine</h1>
      
      <div id="action-buttons">
        <button class="btn btn-primary" onclick="startLocal()">Start Local Engine</button>
        <button class="btn btn-secondary" onclick="showRemoteForm()">Connect to Remote Engine</button>
      </div>

      <div id="remote-form">
        <label for="remote-url" style="display:block; margin-bottom:0.5rem; color:#cbd5e1; font-size:0.9rem;">Remote Engine URL</label>
        <input type="text" id="remote-url" placeholder="e.g. http://192.168.1.15:8080" />
        <button class="btn btn-primary" onclick="connectRemote()">Connect</button>
        <button class="btn btn-secondary" style="border:none; padding:0.5rem; margin-top:-0.5rem;" onclick="hideRemoteForm()">Cancel</button>
      </div>

      <div class="loader" id="loader"></div>
      <div id="status-text"></div>
    </div>

    <script>
      const invoke = window.__TAURI__.core.invoke;
      
      // Load last used remote URL from localStorage
      window.onload = () => {
        const lastUrl = localStorage.getItem('directeur_remote_url');
        if (lastUrl) document.getElementById('remote-url').value = lastUrl;
      };

      function setStatus(msg, showLoader) {
        document.getElementById('status-text').innerText = msg;
        document.getElementById('loader').style.display = showLoader ? 'block' : 'none';
      }

      function hideButtons() {
        document.getElementById('action-buttons').style.display = 'none';
        document.getElementById('remote-form').style.display = 'none';
      }

      function showRemoteForm() {
        document.getElementById('action-buttons').style.display = 'none';
        document.getElementById('remote-form').style.display = 'block';
      }

      function hideRemoteForm() {
        document.getElementById('remote-form').style.display = 'none';
        document.getElementById('action-buttons').style.display = 'block';
      }

      function pingServer(url) {
        fetch(url, { mode: 'no-cors' })
          .then(() => { window.location.href = url; })
          .catch(() => { setTimeout(() => pingServer(url), 500); });
      }

      async function startLocal() {
        hideButtons();
        setStatus("Spawning local engine...", true);
        try {
          await invoke('start_local_engine');
          setStatus("Waiting for engine to bind...", true);
          pingServer('http://localhost:8080/');
        } catch (e) {
          setStatus("Failed to start engine: " + e, false);
          setTimeout(() => { document.getElementById('action-buttons').style.display = 'block'; }, 3000);
        }
      }

      function connectRemote() {
        const url = document.getElementById('remote-url').value.trim();
        if (!url) return;
        localStorage.setItem('directeur_remote_url', url);
        hideButtons();
        setStatus(`Connecting to ${url}...`, true);
        
        fetch(url, { mode: 'no-cors' })
          .then(() => { window.location.href = url; })
          .catch(() => {
            setStatus("Could not reach remote engine.", false);
            setTimeout(showRemoteForm, 2000);
          });
      }
    </script>
  </body>
</html>
